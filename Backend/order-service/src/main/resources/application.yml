server:
  port: 8083

spring:
  application:
    name: ORDER
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: shopytn
    password: shopytn
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: shopytn
    password: shopytn

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

shoptyn:
  rabbitmq:
    exchange: marketplace.events
  clients:
    user-service: USER
    catalog-service: CATALOG
